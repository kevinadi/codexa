<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <script>document.documentElement.style.visibility='hidden'</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Codexa</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <script>
    /* iOS 26/27 installed-PWA top blur: flag <html> so main.css renders the opaque
       #ios-top-fill strip that suppresses the blur iOS paints over the top edge of an
       installed PWA. Deliberately iOS AND installed only — in a browser tab the strip
       would sit over real page content, which has no status bar to hide behind.
       Also writes --ios-topbar: env(safe-area-inset-top) is unreliable in iOS standalone
       (0px at load), so the strip also gets the status-bar height measured directly. In an
       installed PWA the viewport excludes the status bar while screen.height includes it,
       so the difference IS the bar — sanity-clamped, because a wrong number here is worse
       than falling back to env(). */
    (function () {
      try {
        var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var mq = window.matchMedia;
        var pwa = navigator.standalone === true ||
                  (mq && (mq('(display-mode: standalone)').matches ||
                          mq('(display-mode: fullscreen)').matches));
        if (!iOS || !pwa) return;
        document.documentElement.className += ' ios-pwa';
        // --sat is what the whole app lays its top chrome out with (header padding, reader
        // padding, the strip's height) and the Android path already overrides it from JS after
        // the chrome settles. Writing the measurement to the SAME variable is what keeps the
        // strip and the layout in step: strip = inset + 8px, header padding = 8px + inset, so
        // the opaque strip lands exactly on the header's own padding and never over content.
        var measure = function () {
          var bar = Math.round(window.screen.height - window.innerHeight);
          if (bar >= 12 && bar <= 120) {
            document.documentElement.style.setProperty('--ios-topbar', bar + 'px');
          }
        };
        measure();
        window.addEventListener('load', measure, { once: true });
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .oidc-cb-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- iOS installed-PWA top blur fix (see the #ios-top-fill block in main.css). -->
  <div id="ios-top-fill" aria-hidden="true"></div>

  <div class="oidc-cb-box">
    <span class="spinner"></span>
    <p data-i18n="login.oidc_finishing">Zaključujem prijavo…</p>
  </div>

  <script type="module">
    import { setToken } from '/js/api.js';
    import { initI18n } from '/js/i18n.js';

    (async () => {
      await initI18n();

      // Token travels in the URL fragment, not a query string, so it's never sent to the
      // server or logged in any access log / Referer header (see server/routes/oidc.js).
      const hash = window.location.hash.replace(/^#/, '');
      const token = new URLSearchParams(hash).get('token');

      if (!token) {
        window.location.replace('/login.html?error=oidc_failed');
        return;
      }

      setToken(token);
      history.replaceState(null, '', '/oidc-callback.html');

      try {
        const res = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error('me failed');
        const data = await res.json();
        localStorage.setItem('br_user', JSON.stringify(data.user));
      } catch (_) {
        // Token is still valid even if this enrichment call fails — the rest of the app
        // re-fetches /auth/me itself; not fatal, just proceed.
      }

      window.location.replace('/');
    })();
  </script>
</body>
</html>
